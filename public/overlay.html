<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Scoreboard</title>
    <link rel="stylesheet" href="/overlay.css">
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/overlay.js" defer></script>
</head>
<body>
    <main class="overlay" aria-label="Live badminton score">
        <section class="scoreboard" aria-label="Match score">
            <div class="game-marker" aria-label="Current game">
                <span>Game</span>
                <strong id="game-number">1</strong>
            </div>

            <div class="players">
                <div class="player-row">
                    <span id="player-a-serving" class="serve-indicator" aria-hidden="true">Serve</span>
                    <span id="player-a-name" class="player-name">Player A</span>
                    <span id="player-a-point-status"></span>
                </div>
                <div class="player-row">
                    <span id="player-b-serving" class="serve-indicator" aria-hidden="true">Serve</span>
                    <span id="player-b-name" class="player-name">Player B</span>
                    <span id="player-b-point-status"></span>
                </div>
            </div>

            <div id="completed-games" class="completed-games" aria-label="Completed game scores"></div>

            <div class="live-scores" aria-label="Current game score">
                <strong id="player-a-score">0</strong>
                <strong id="player-b-score">0</strong>
            </div>
        </section>

        <div id="winning-player" class="winner" role="status" hidden></div>
    </main>
</body>
</html>
