<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Scoreboard</title>
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/overlay.js" defer></script>
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <main class="scoreboard">
    <div class="game-box">
        <span class="label">Game</span>
        <strong id="game-number">1</strong>
    </div>

    <section class="player">
        <span id="player-a-serving" class="serve-dot"></span>
        <span id="player-a-name" class="player-name">Player A</span>
        <span class="games">
            G<span id="player-a-games-won">0</span>
        </span>
        <strong id="player-a-score" class="score">0</strong>
    </section>

    <section class="player">
        <span id="player-b-serving" class="serve-dot"></span>
        <span id="player-b-name" class="player-name">Player B</span>
        <span class="games">
            G<span id="player-b-games-won">0</span>
        </span>
        <strong id="player-b-score" class="score">0</strong>
    </section>

    <div id="winning-player" class="winner" hidden></div>
    </main>
</body>
</html>
